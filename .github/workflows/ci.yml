name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck jq
      - run: make lint test
